name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto
        run: rm -rf work && unzip -q StatusBarIOS.zip -d work
      - name: Build
        working-directory: work/StatusBarIOS
        run: gradle assembleDebug --no-daemon
      - name: Renomear APK
        working-directory: work/StatusBarIOS
        run: cp app/build/outputs/apk/debug/app-debug.apk VolumeIos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VolumeIos
          path: work/StatusBarIOS/VolumeIos.apk
